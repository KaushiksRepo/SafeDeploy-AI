name: SafeDeploy AI - CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: safedeployaiacr.azurecr.io
  IMAGE_NAME: safedeploy-app
  AKS_RESOURCE_GROUP: rg-safedeploy-ai
  AKS_CLUSTER_NAME: aks-safedeploy-ai

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: application
        run: pytest tests


  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name safedeployaiacr

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            ./application

      - name: Push Docker image to ACR
        run: |
          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}


  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $AKS_RESOURCE_GROUP \
            --name $AKS_CLUSTER_NAME \
            --overwrite-existing

      - name: Deploy new version to Canary
        run: |
          kubectl set image deployment/safedeploy-canary \
            safedeploy-app=$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Wait for Canary rollout
        run: |
          kubectl rollout status deployment/safedeploy-canary --timeout=180s

      - name: Run Canary Health Check
        id: canary-health
        run: |
          kubectl run canary-health-check \
            --rm \
            -i \
            --restart=Never \
            --image=curlimages/curl \
            -- curl -fsS http://safedeploy-canary-service/health

      - name: Promote Canary to Stable
        if: steps.canary-health.outcome == 'success'
        run: |
          kubectl set image deployment/safedeploy-app \
            safedeploy-app=$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

          kubectl rollout status deployment/safedeploy-app --timeout=180s

      - name: Rollback Canary
        if: steps.canary-health.outcome == 'failure'
        run: |
          echo "Canary health check failed. Rolling back..."
          kubectl rollout undo deployment/safedeploy-canary
          kubectl rollout status deployment/safedeploy-canary --timeout=180s

      - name: Fail Deployment
        if: steps.canary-health.outcome == 'failure'
        run: |
          echo "Canary deployment failed. Stable version was NOT promoted."
          exit 1

      - name: Verify Deployment
        run: |
          kubectl get deployment safedeploy-app
          kubectl get deployment safedeploy-canary
          kubectl get pods -l app=safedeploy-app